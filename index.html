<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Henry Stickmin Collection (Unified Web Port)</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
            font-family: sans-serif;
        }
        #game-wrapper {
            position: relative; width: 100%; height: 100%;
            max-width: 1280px; max-height: 720px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        ruffle-player { width: 100%; height: 100%; }
        #fullscreen-btn {
            position: absolute; bottom: 10px; right: 10px; z-index: 99;
            background: rgba(255, 255, 255, 0.2); color: #fff;
            border: 1px solid rgba(255,255,255,0.4); padding: 6px 12px;
            cursor: pointer; border-radius: 4px; font-size: 12px;
            transition: background 0.2s;
        }
        #fullscreen-btn:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>
    <div id="game-wrapper">
        <button id="fullscreen-btn" onclick="toggleFullscreen()">Go Fullscreen</button>
        <div id="player-container" style="width:100%; height:100%;"></div>
    </div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player-container");
            container.appendChild(player);
            
            player.config = {
                letterbox: "on", unmuteOverlay: "visible",
                backgroundColor: "#000000", autoplay: "on",
                splashScreen: true, allowScriptAccess: true 
            };
            player.load("Henry.swf");
